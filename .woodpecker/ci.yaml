clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

when:
  - event: push
    branch: [dev, main]
  - event: pull_request
  - event: manual

steps:
  - name: validate
    image: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    commands:
      - |
        set -eu
        npm install --global bun@1.3.14 deno@2.9.2
        bun install --frozen-lockfile
        bun audit --audit-level=high
        bun run check
        bun run check:versions
        bun run check:docs
        bun run check:jsr
        bun run test:coverage
        bun run build
        bun run test:consumer
        node --input-type=module --eval 'const mod = await import("./dist/index.js"); if (typeof mod.TypeTypeMsePlayer !== "function") process.exit(1)'
